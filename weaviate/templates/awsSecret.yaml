{{-  $t2vAWS := and (index .Values "modules" "text2vec-aws" "enabled") (index .Values "modules" "text2vec-aws" "secrets") -}}
{{-  $m2vAWS := and (index .Values "modules" "multi2vec-aws" "enabled") (index .Values "modules" "multi2vec-aws" "secrets") -}}
{{-  $generativeAWS := and (index .Values "modules" "generative-aws" "enabled") (index .Values "modules" "generative-aws" "secrets") }}
{{-  $backupS3 := and (index .Values "backups" "s3" "enabled") (index .Values "backups" "s3" "secrets") -}}
{{-  $offloadS3 := and (index .Values "offload" "s3" "enabled") (index .Values "offload" "s3" "secrets") -}}
{{- $awsSources := list }}
{{- if $t2vAWS }}
  {{- $awsSources = append $awsSources (index .Values "modules" "text2vec-aws" "secrets") -}}
{{- end }}
{{- if $m2vAWS }}
  {{- $awsSources = append $awsSources (index .Values "modules" "multi2vec-aws" "secrets") -}}
{{- end }}
{{- if $generativeAWS }}
  {{- $awsSources = append $awsSources (index .Values "modules" "generative-aws" "secrets") -}}
{{- end }}
{{- if $backupS3 }}
  {{- $awsSources = append $awsSources (index .Values "backups" "s3" "secrets") -}}
{{- end }}
{{- if $offloadS3 }}
  {{- $awsSources = append $awsSources (index .Values "offload" "s3" "secrets") -}}
{{- end }}

{{- if gt (len $awsSources) 1 -}}
  {{- fail "AWS modules activated, but with both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY keys. Please choose one configuration to pass AWS credentials." }}
{{- end }}

{{- if $awsSources -}}
{{- $secrets := index $awsSources 0 }}
apiVersion: v1
kind: Secret
metadata:
  {{- if .Values.namespaceOverride }}
  namespace: {{ .Values.namespaceOverride }}
  {{- end }}
  name: weaviate-aws
  labels:
    app.kubernetes.io/name: weaviate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- with $secrets.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_ID: {{ . | b64enc }}
  {{- end }}
  {{- with $secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: {{ . | b64enc }}
  {{- end }}
{{- end }}
