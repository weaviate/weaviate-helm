{{-  $t2vDigitalOcean := and (index .Values "modules" "text2vec-digitalocean" "enabled") (index .Values "modules" "text2vec-digitalocean" "apiKey") -}}
{{-  $generativeDigitalOcean := and (index .Values "modules" "generative-digitalocean" "enabled") (index .Values "modules" "generative-digitalocean" "apiKey") }}
{{- if or ($t2vDigitalOcean) ($generativeDigitalOcean) }}

{{- $apiKeys := list }}
{{- if $t2vDigitalOcean }}
  {{- $apiKeys = append $apiKeys (index .Values "modules" "text2vec-digitalocean" "apiKey") -}}
{{- end }}
{{- if $generativeDigitalOcean }}
  {{- $apiKeys = append $apiKeys (index .Values "modules" "generative-digitalocean" "apiKey") -}}
{{- end }}

{{- if gt (len ($apiKeys | uniq)) 1 -}}
  {{- fail "DigitalOcean modules activated, but their keys differ. Use the same key on all activated DigitalOcean modules." }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: weaviate-digitalocean
  labels:
    app.kubernetes.io/name: weaviate
    app.kubernetes.io/managed-by: helm
type: Opaque
data:
  apiKey: {{ index $apiKeys 0 | b64enc }}
{{- end }}
