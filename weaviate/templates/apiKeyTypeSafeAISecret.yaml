{{ if and (index .Values "modules" "reranker-typesafeai" "enabled") (index .Values "modules" "reranker-typesafeai" "apiKey") }}
apiVersion: v1
kind: Secret
metadata:
  name: weaviate-typesafeai
  labels:
    app.kubernetes.io/name: weaviate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  apiKey: {{ index .Values "modules" "reranker-typesafeai" "apiKey" | b64enc }}
{{ end }}
